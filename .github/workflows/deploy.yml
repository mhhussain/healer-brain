name: Test, export and publish

# Every push and pull request: import the Godot project in game/, run its tests and export it
# for the web. A push to main also publishes that export to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # keep in step with the Godot installed locally (godot --version)
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and the web export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot and the web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot/templates
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j templates.tpz 'templates/web_nothreads_*' templates/version.txt -d ~/godot/templates
          rm godot.zip templates.tpz
      - name: Install them
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "$HOME/godot" >> $GITHUB_PATH
      - name: Import
        run: godot --headless --path game --import
      - name: Test
        # --fixed-fps lets the tests that play out whole fights run as fast as the machine can
        run: godot --headless --fixed-fps 60 --path game -s addons/gut/gut_cmdln.gd -gexit
      - name: Export for the web
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release Web "$PWD/build/web/index.html"
          # the export can fail without a failing exit code, so check what it wrote
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      # the site as it would be published; on a pull request it is only a download to try
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # one publish at a time, and one that has started is left to finish
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
